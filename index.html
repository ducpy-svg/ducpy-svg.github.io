<!DOCTYPE html>
<html lang="vi" data-theme="day" data-primary="ocean" data-skin="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocean EDU - Student management list (Unofficial) ver 1.4.7</title>
  <link rel="icon" href="Token.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Cabin:wght@400;600;700&family=Crimson+Pro:wght@600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Quicksand:wght@400;600;700&family=Roboto:wght@400;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('oceanEdu.v1') || '{}');
      var skins = ['default', 'y2k', 'mcbling', 'aero', 'preppy', 'goth', 'fantasy', 'aerox', 'vapor', 'indie', 'seapunk', 'cottage', 'academia', 'goblin', 'lightac', 'neo2k', 'realism', 'dark', 'classic', 'disrupt', 'collage', 'cyber'];
      var skin = 'default';
      var who = JSON.parse(sessionStorage.getItem('oceanEduUser') || 'null');
      var accounts = saved.accounts || [];
      for (var i = 0; i < accounts.length; i++) {
        var look = who && accounts[i].username === who.username ? accounts[i].appearance : null;
        var rawSkin = look && look.skin;
        if (rawSkin === 'minimal') rawSkin = 'goth';
        if (!look || skins.indexOf(rawSkin) < 0) continue;
        skin = rawSkin;
      }
      document.documentElement.setAttribute('data-theme', 'day');
      document.documentElement.setAttribute('data-primary', 'ocean');
      document.documentElement.setAttribute('data-skin', skin);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <span class="bubble b1"></span>
    <span class="bubble b2"></span>
    <span class="bubble b3"></span>
    <span class="bubble b4"></span>
    <span class="bubble b5"></span>
    <span class="bubble b6"></span>
    <span class="pfish f1"></span>
    <span class="pfish f2"></span>
    <span class="pfish f3"></span>
    <div class="sea-bed">
      <div class="wave3d">
        <div class="wave-sheet sheet-a"></div>
        <div class="wave-sheet sheet-b"></div>
        <div class="wave-sheet sheet-c"></div>
      </div>
    </div>
    <span class="boat"></span>
  </div>
  <div class="nostalgia" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div id="loader" class="loader hidden" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="coin-stage">
        <img src="Token.png" alt="" class="token-spin">
      </div>
      <p id="loader-title">Đang đo màn hình và đọc dữ liệu...</p>
      <p id="loader-note" class="help"></p>
    </div>
  </div>

  <div id="syncbox" class="syncbox hidden" role="status" aria-live="polite">
    <img src="Token.png" alt="Đang ghi" class="sync-token">
    <span id="sync-label"></span>
  </div>
  <div id="print-root"></div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="noticebox" class="dialog hidden" role="dialog" aria-modal="true" aria-label="Thông báo data"></div>
  <div id="gatebox" class="gatebox hidden" role="dialog" aria-modal="true" aria-label="Việc cần xác nhận"></div>

  <div id="clockbox" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="clock-heading">
    <div class="dialog-card" data-stop>
      <div class="dialog-head">
        <h2 id="clock-heading">Ngày giờ hệ thống</h2>
        <button type="button" class="icon-x" data-act="close-clock" aria-label="Đóng">X</button>
      </div>
      <p class="clock-week" data-live="weekday">—</p>
      <p class="clock-date" data-live="date">—</p>
      <p class="clock-time" data-live="time-sec">—</p>
      <p class="muted">Đồng hồ 12 giờ, A.M. và P.M., chạy theo thời gian thực của máy.</p>
    </div>
  </div>

  <div id="settingsbox" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
    <div class="dialog-card settings-card" data-stop>
      <form id="settings-form">
        <div class="dialog-head">
          <h2 id="settings-heading">Cài đặt</h2>
          <button type="button" class="icon-x" data-act="close-settings" aria-label="Đóng">X</button>
        </div>
        <p class="field-label">Giao diện</p>
        <div id="skin-groups" class="skin-groups"></div>
        <p class="help">Default giữ bảng màu sóng biển. Ba nhóm giao diện nằm bên dưới: bấm tên nhóm để xem khung xem trước và mô tả, rồi bấm một giao diện để dùng.</p>
        <label class="field">
          <span>Tiêu đề</span>
          <input id="setting-title" type="text" maxlength="120" required>
        </label>
        <div class="modal-foot">
          <button type="submit" class="btn btn-primary">Lưu</button>
          <button type="button" class="btn" data-act="close-settings">Đóng</button>
        </div>
      </form>
      <div id="account-panel"></div>
      <div id="script-panel"></div>
    </div>
  </div>

  <div id="previewbox" class="hidden" role="dialog" aria-modal="true" aria-label="Xem ảnh">
    <div class="preview-bar">
      <button type="button" class="btn" data-act="preview-out" aria-label="Thu nhỏ">−</button>
      <button type="button" class="btn" data-act="preview-in" aria-label="Phóng to">+</button>
      <button type="button" class="btn" data-act="preview-close">Đóng</button>
    </div>
    <div class="preview-stage" id="preview-stage">
      <img id="preview-img" alt="Xem ảnh" draggable="false">
    </div>
  </div>

  <div id="app"></div>

  <script src="xlsx.full.min.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
